[project]
name = "qt-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "benbenbang", email = "bn@bitbrew.dev" }
]
requires-python = ">=3.13.14"
dependencies = [
    "itofin>=0.45.0",
    "quantlib>=1.44",
    "rich>=15.0.0",
]

[project.scripts]
qt-bench = "qt_bench:main"
qt-bench-async = "qt_bench_async:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

# optional - choose between tool.uv or build-version
# [build-system]
# requires = ["uv_build>=0.8.9,<0.9.0"]
# build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
ignore = ["E731"]
# exclude = ["ALL"]
# select = ["PL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "consider-using-f-string",
    "cyclic-import",
    "deprecated-module",
    "f-string-without-interpolation",
    "import-error",
    "import-self",
    "undefined-variable",
    "undefined-all-variable",
    "unused-format-string-argument",
    "unused-format-string-key",
    "unused-import",
    #   This might be unused but a mandatory signature in airflow runtime
    #   "unused-argument",
    "unused-wildcard-import",
    "unused-variable",
    "used-before-assignment",
    "use-list-literal",
    "raise-missing-from",
    "simplifiable-condition",
    "simplify-boolean-expression",
    "super-with-arguments",
    "wrong-spelling-in-comment",
    "wrong-spelling-in-docstring",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
# Suppress diagnostics for these paths, even when files are open in the editor
ignore = [".agents", ".claude"]

[tool.pytest.ini_options]
addopts = '--basetemp=/tmp/pytest'
# switch on `-s` for deep debuging
# addopts = '-s --basetemp=/tmp/pytest'

# The last matching entry wins: mute everything, then re-enable warnings attributed to the project package.
# Attribution follows `stacklevel`, so a library deprecation whose stacklevel points at a project caller
# (the usual `stacklevel=2`) is kept too. `pytest.warns` records regardless of these filters.
filterwarnings = [
    "ignore",
    "default:::qt_bench(\\.|$)",
    "default:::qt_bench_async(\\.|$)",
]

# testpaths = ["tests/project-name"]

markers = [
    "unittests: run unittests",
    "integrationtests: run integrationtests",
]

[tool.mypy]
ignore_missing_imports = true
warn_unreachable = true

[tool.black]
line-length = 120
exclude = '''
/(
  | {{ cookiecutter.* }}
  | hooks
  | .venv
  | .cache
)/
'''

[tool.coverage.run]
omit = [
    "tests/*",
    "**/__init__.py",
    "datamodel/*",
    "*/sql/*",
    "*__SQL.py",
    "*__DAG.py",
    "*/__init__.py",
    "*/setup.py",
    "provider/*",
]
source = ["."]
parallel = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", '\.\.\.', '...']
exclude_also = [
    "# pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    '\.\.\.',
    '...',
]
