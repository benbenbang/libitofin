repos:
    - repo: https://github.com/benbenbang/pre-commit-rust
      rev: v1.0.0
      hooks:
        - id: fmt
        - id: check
        - id: clippy
        - id: test
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
        - id: check-yaml
          args:
            - --allow-multiple-documents
            - --unsafe
        - id: end-of-file-fixer
        - id: trailing-whitespace
          exclude: '\.md$'
        - id: check-added-large-files
          args:
            - --maxkb=1024
          stages:
            - pre-commit
        - id: requirements-txt-fixer
        - id: check-merge-conflict
        - id: debug-statements
        - id: pretty-format-json
          args:
            - --autofix
            - --indent=2
    - repo: local
      hooks:
        - id: cargo-check-examples
          name: cargo check --examples
          entry: cargo check --examples -p libitofin
          language: system
          types: [rust]
          pass_filenames: false
        - id: go-bindings-tests
          name: Go and C ABI validation
          entry: bash scripts/check_go_bindings.sh
          language: system
          files: ^(crates/(libitofin|libitofin-ffi)/|crates/itofin-py/python/itofin/.*\.pyi$|sdk/go/|scripts/(check_go_|package_go_native\.sh$|fixtures/go-(consumer|install-failures)/)|docs/go-coverage/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.pre-commit-config\.yaml$|\.github/workflows/(go-(bindings|package|release)|pre-commit)\.yml$)
          pass_filenames: false
        - id: itofin-submodule-shims
          name: itofin generated stubs and submodule shims in sync
          entry: python3 crates/itofin-py/scripts/gen_stubs.py
          language: system
          files: ^crates/itofin-py/python/itofin/.*\.pyi$
          pass_filenames: false
        - id: python-typing-gate-tests
          name: Python typing gate regression tests
          entry: python -m unittest discover -s crates/itofin-py/scripts -p test_*.py
          language: python
          additional_dependencies: [pyright==1.1.411, pytest==8.4.2, numpy==2.2.6]
          files: ^(crates/itofin-py/|\.pre-commit-config\.yaml$|\.github/workflows/pre-commit\.yml$)
          pass_filenames: false
        - id: python-typing-baseline
          name: Python diagnostics match in both directions
          entry: python crates/itofin-py/scripts/check_typing.py
          language: python
          additional_dependencies: [pyright==1.1.411, pytest==8.4.2, numpy==2.2.6]
          files: ^(crates/itofin-py/|\.pre-commit-config\.yaml$|\.github/workflows/pre-commit\.yml$)
          pass_filenames: false
        - id: release-contract-tests
          name: Release identity and publication contracts
          entry: python -m unittest discover -s scripts -p test_*release*.py
          language: python
          language_version: python3.13
          files: ^(scripts/.*release.*|\.releaserc\.json$|\.github/workflows/(semantic-release|go-(release|package))\.yml$)
          pass_filenames: false
        - id: validate-commit-msg
          name: commit message is valid
          args:
            - --negate
          entry: ^(build|ci|docs|feat|fix|perf|refactor|style|test|revert|hotfix|ops|chore|incompat)\([\w,\.,\-,\(,\),\/,\#]+\)(!?)(:)\s{1}([\w,\W,:]+)$
          language: pygrep
          stages:
            - commit-msg
