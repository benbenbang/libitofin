name: semantic-release

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "If you are sure to launch a new release, put the value to true."
        default: "false"
        required: true
        type: choice
        options:
          - "true"
          - "false"

      dry_run:
        description: "Preview the version and notes without publishing"
        default: false
        type: boolean

concurrency:
  group: coordinated-release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: semantic-release
    if: ${{ inputs.prompt == 'true' }}
    uses: benbenbang/reusable-workflows/.github/workflows/semantic-release.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: read
      packages: read
    secrets: inherit
    with:
      new_version_title: "🧮 LibItoFin"
      dry_run: ${{ inputs.dry_run }}

  publish-crate:
    name: publish libitofin to crates.io
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.new_release == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token crates.io trusted publishing verifies
    steps:
      - name: checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_tag }}
      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Verify the committed release version
        env:
          RELEASE_TAG: ${{ needs.semantic-release.outputs.new_release_tag }}
        run: python3 scripts/check_release_version.py "$RELEASE_TAG"
      - name: authenticate to crates.io via OIDC trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p libitofin --locked

  build-python-wheels:
    name: build itofin wheels (${{ matrix.os }})
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.new_release == 'true' && !inputs.dry_run }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the committed release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.semantic-release.outputs.new_release_tag }}
        run: python3 scripts/check_release_version.py "$RELEASE_TAG"
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m crates/itofin-py/Cargo.toml
          manylinux: auto
      - name: build sdist
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/itofin-py/Cargo.toml
      - name: upload the built distributions
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  publish-pypi:
    name: publish itofin to PyPI
    needs: [semantic-release, build-python-wheels]
    if: ${{ needs.semantic-release.outputs.new_release == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token PyPI trusted publishing verifies
    environment: pypi
    steps:
      - name: download all built distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: publish to PyPI via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # For a TestPyPI dry-run, register a separate TestPyPI trusted publisher,
        # then uncomment the override below (and remove it for the real publish):
        # with:
        #   repository-url: https://test.pypi.org/legacy/

  publish-go:
    name: Publish and verify Go bindings
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.new_release == 'true' && !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/go-release.yml
    with:
      release_tag: ${{ needs.semantic-release.outputs.new_release_tag }}
