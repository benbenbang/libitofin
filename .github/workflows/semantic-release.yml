name: semantic-release

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "If you are sure to launch a new release, put the value to true."
        default: "false"
        required: true
        type: choice
        options:
          - "true"
          - "false"

      dry_run:
        description: "Preview the version and notes without publishing"
        default: false
        type: boolean

      release_tag:
        description: "Resume an existing stable release (vVERSION); empty creates a new release"
        default: ''
        type: string
      publish_targets:
        description: "Which publication channels to run"
        default: all
        type: choice
        options: [all, rust, python, go]
      python_artifact_run_id:
        description: "Reuse complete successful wheel artifacts from this run instead of rebuilding"
        default: ''
        type: string
  # Set the repository Actions variable ENABLE_SCHEDULED_RELEASES to 'true' to enable.
  schedule:
    - cron: '0 0 * * 2,6' # Tuesday and Saturday at 00:00 UTC

concurrency:
  group: coordinated-release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: semantic-release
    if: ${{ (inputs.prompt == 'true' || (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_RELEASES == 'true')) && inputs.release_tag == '' }}
    uses: benbenbang/reusable-workflows/.github/workflows/semantic-release.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: read
      packages: read
    secrets: inherit
    with:
      new_version_title: "🧮 LibItoFin"
      dry_run: ${{ inputs.dry_run || false }}

  resolve-release:
    needs: semantic-release
    if: ${{ !cancelled() && (inputs.prompt == 'true' || (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_RELEASES == 'true')) && (needs.semantic-release.result == 'success' || needs.semantic-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and validate immutable release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          NEW_RELEASE: ${{ needs.semantic-release.outputs.new_release }}
          NEW_TAG: ${{ needs.semantic-release.outputs.new_release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHON_ARTIFACT_RUN_ID: ${{ inputs.python_artifact_run_id }}
        run: python3 scripts/resolve_release.py

  publish-optimizer:
    name: publish itofin-optimize to crates.io
    needs: resolve-release
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.resolve-release.outputs.publish == 'true' && (github.event_name == 'schedule' || inputs.publish_targets == 'all' || inputs.publish_targets == 'rust') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
      RELEASE_REVISION: ${{ needs.resolve-release.outputs.revision }}
    steps:
      - name: checkout publication tooling
        uses: actions/checkout@v4
      - name: checkout immutable released source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.revision }}
          path: release
      - name: read released Rust toolchain
        id: rust
        run: python3 -c 'import os,tomllib; v=tomllib.load(open("release/rust-toolchain.toml","rb"))["toolchain"]["channel"]; assert "\n" not in v; open(os.environ["GITHUB_OUTPUT"],"a").write(f"toolchain={v}\n")'
      - name: install released Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - name: Verify package and reconcile existing publication
        id: package
        run: python3 scripts/publish_release_crate.py itofin-optimize "$RELEASE_TAG" "$RELEASE_REVISION" --root release
      - name: authenticate to crates.io via OIDC trusted publishing
        if: steps.package.outputs.upload_required == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish once and verify registry completion
        if: steps.package.outputs.upload_required == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish_release_crate.py itofin-optimize "$RELEASE_TAG" "$RELEASE_REVISION" --root release --publish

  publish-crate:
    name: publish libitofin to crates.io
    needs: [resolve-release, publish-optimizer]
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.publish-optimizer.result == 'success' && needs.resolve-release.outputs.publish == 'true' && (github.event_name == 'schedule' || inputs.publish_targets == 'all' || inputs.publish_targets == 'rust') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
      RELEASE_REVISION: ${{ needs.resolve-release.outputs.revision }}
    steps:
      - name: checkout publication tooling
        uses: actions/checkout@v4
      - name: checkout immutable released source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.revision }}
          path: release
      - name: read released Rust toolchain
        id: rust
        run: python3 -c 'import os,tomllib; v=tomllib.load(open("release/rust-toolchain.toml","rb"))["toolchain"]["channel"]; assert "\n" not in v; open(os.environ["GITHUB_OUTPUT"],"a").write(f"toolchain={v}\n")'
      - name: install released Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - name: Verify package and reconcile existing publication
        id: package
        run: python3 scripts/publish_release_crate.py libitofin "$RELEASE_TAG" "$RELEASE_REVISION" --root release
      - name: authenticate to crates.io via OIDC trusted publishing
        if: steps.package.outputs.upload_required == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish once and verify registry completion
        if: steps.package.outputs.upload_required == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish_release_crate.py libitofin "$RELEASE_TAG" "$RELEASE_REVISION" --root release --publish

  build-python-wheels:
    name: build itofin wheels
    needs: resolve-release
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.resolve-release.outputs.publish == 'true' && (github.event_name == 'schedule' || inputs.publish_targets == 'all' || inputs.publish_targets == 'python') && inputs.python_artifact_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/python-wheels.yml
    with:
      release_tag: ${{ needs.resolve-release.outputs.tag }}
      release_revision: ${{ needs.resolve-release.outputs.revision }}

  publish-pypi:
    name: publish itofin to PyPI
    needs: [resolve-release, build-python-wheels]
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.resolve-release.outputs.publish == 'true' && (github.event_name == 'schedule' || inputs.publish_targets == 'all' || inputs.publish_targets == 'python') && (needs.build-python-wheels.result == 'success' || (inputs.python_artifact_run_id != '' && needs.build-python-wheels.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - name: download all validated built distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.python_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify complete distributions and already-published file hashes
        id: package
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: python3 scripts/prepare_release_pypi.py "$RELEASE_TAG" dist --verify-downloads
      - name: publish missing verified files via OIDC trusted publishing
        if: steps.package.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-go:
    name: Publish and verify Go bindings
    needs: resolve-release
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.resolve-release.outputs.publish == 'true' && (github.event_name == 'schedule' || inputs.publish_targets == 'all' || inputs.publish_targets == 'go') }}
    permissions:
      contents: write
    uses: ./.github/workflows/go-release.yml
    with:
      release_tag: ${{ needs.resolve-release.outputs.tag }}
      release_revision: ${{ needs.resolve-release.outputs.revision }}
