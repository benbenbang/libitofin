name: pull-request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - edited
      - reopened

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit checks
    uses: benbenbang/reusable-workflows/.github/workflows/prek.yml@1.0.2
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      go_version_file: sdk/go/go.mod
      prek_skip: fmt,check,clippy,test

  check-change-files:
    name: check-changed-files
    outputs:
      rust: ${{ steps.check-changes.outputs.rust_any_modified }}
      go: ${{ steps.check-changes.outputs.go_any_modified }}
      docs: ${{ steps.check-changes.outputs.docs_any_modified }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: check validation paths
        id: check-changes
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32 # v46.0.1
        with:
          files_yaml: |
            rust:
              - crates/**/src/**
              - crates/**/tests/**
              - crates/**/Cargo.toml
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .github/workflows/*.yml

            go:
              - crates/**
              - sdk/go/**
              - scripts/check_go_*
              - scripts/package_go_native.sh
              - scripts/check_release_attribution.py
              - scripts/check_release_version.py
              - scripts/publish_go_release.py
              - scripts/test_*release*.py
              - .releaserc.json
              - scripts/fixtures/go-consumer/**
              - scripts/fixtures/go-install-failures/**
              - docs/go-coverage/**
              - Cargo.*
              - rust-toolchain.toml
              - .github/workflows/*.yml

            docs:
              - README.md
              - wiki/**
              - docs/**
              - crates/itofin-py/python/**
              - crates/libitofin/examples/**
              - example/**
              - sdk/go/examples/**
              - .github/workflows/*.yml

  rust-ci:
    name: rust ci
    runs-on: ubuntu-latest
    needs: check-change-files
    if: needs.check-change-files.outputs.rust == 'true'
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: restore cargo caches
        uses: Swatinem/rust-cache@v2
      - name: check formatting
        run: cargo fmt --all -- --check
      - name: run cargo check
        run: cargo check --workspace --all-targets
      - name: run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: run tests
        run: cargo test --workspace

  python-bindings:
    name: python bindings
    needs: check-change-files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install maturin and pytest
        run: pip install --no-cache-dir maturin pytest numpy

      - name: build and install the itofin extension module
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r crates/itofin-py/typing-requirements.txt
          maturin develop --release -m crates/itofin-py/Cargo.toml

      - name: check the committed stubs and shims match the rust facade
        run: |
          . .venv/bin/activate
          set +e
          python crates/itofin-py/scripts/gen_stubs.py
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          git diff --exit-code -- crates/itofin-py/python
          test -z "$(git status --porcelain -- crates/itofin-py/python)"

      - name: check both directions of the typing baseline
        run: |
          . .venv/bin/activate
          python -m unittest discover -s crates/itofin-py/scripts -p 'test_*.py'
          python crates/itofin-py/scripts/check_typing.py

      - name: build the same-profile Rust FD oracle
        run: |
          oracle="$RUNNER_TEMP/fd-binding-oracle.json"
          cargo run --quiet --release -p libitofin --example fd_binding_oracle > "$oracle"
          python -m json.tool "$oracle" > /dev/null
          echo "ITOFIN_FD_ORACLE_JSON=$oracle" >> "$GITHUB_ENV"

      - name: build the same-profile Heston method oracles
        run: |
          core_oracle="$RUNNER_TEMP/heston-methods-core-oracle.json"
          cargo run --quiet --release -p libitofin-ffi --example optimization_methods_oracle > "$core_oracle"
          python -m json.tool "$core_oracle" > /dev/null
          echo "ITOFIN_HCAL_METHODS_CORE_ORACLE=$core_oracle" >> "$GITHUB_ENV"
          cargo build --release -p libitofin-ffi
          go_oracle="$RUNNER_TEMP/heston-methods-go-oracle.json"
          cd sdk/go
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release" go run ./examples/optimization_methods_oracle > "$go_oracle"
          python -m json.tool "$go_oracle" > /dev/null
          echo "ITOFIN_HCAL_METHODS_GO_ORACLE=$go_oracle" >> "$GITHUB_ENV"

      - name: run the pytest oracle
        run: |
          . .venv/bin/activate
          ITOFIN_HCAL_CORE_ORACLE="$(cargo run --quiet --release -p libitofin-ffi --example calibration_constraints_oracle)"
          export ITOFIN_HCAL_CORE_ORACLE
          pytest crates/itofin-py/tests -v

  pr-labeler:
    name: pr labeler
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: pr labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  go-bindings:
    needs: check-change-files
    if: needs.check-change-files.outputs.go == 'true'
    uses: ./.github/workflows/go-bindings.yml

  go-package:
    needs: check-change-files
    if: needs.check-change-files.outputs.go == 'true'
    uses: ./.github/workflows/go-package.yml

  docs:
    needs: check-change-files
    if: needs.check-change-files.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build site (strict)
        working-directory: docs
        run: uv run --frozen mkdocs build --strict

  workflow-success:
    name: workflow-success
    needs: [check-change-files, pre-commit, rust-ci, python-bindings, go-bindings, go-package, docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          paths = needs["check-change-files"]["outputs"]
          conditional = {"rust-ci": "rust", "go-bindings": "go", "go-package": "go", "docs": "docs"}
          failed = False
          for job, details in needs.items():
              result = details["result"]
              flag = paths.get(conditional[job]) if job in conditional else "true"
              accepted = flag in ("true", "false") and (
                  result == "success" or (result == "skipped" and flag == "false")
              )
              print(f"{job}: {result} (required: {flag})", flush=True)
              failed |= not accepted
          sys.exit(1 if failed else 0)
